<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wi‑Fi Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      width: 300px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      text-align: center;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #0078ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #005fcc; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Wi‑Fi Login</h2>
    <input type="text" placeholder="Email or Username">
    <input type="password" placeholder="Password">
    <button>Continue</button>
  </div>
</body>
</html>
